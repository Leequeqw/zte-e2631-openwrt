name: Build E2631 mwan3ct kernel dependency

on:
  push:
    branches:
      - codex/mwan3ct-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      E2631_TREE: ${{ github.workspace }}/../openwrt
      E2631_OUT: ${{ github.workspace }}/../out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl busybox libelf-dev xsltproc
      - name: Check and bootstrap pinned source
        run: |
          make check
          make bootstrap
          grep -q '^CONFIG_PACKAGE_kmod-nf-conntrack-netlink=m' "$E2631_TREE/.config"
      - name: Build matching firmware tree and module package
        run: bash scripts/build.sh --no-pack
      - name: Collect module verification bundle
        run: |
          set -euo pipefail
          mkdir -p mwan3ct-kmod
          find "$E2631_TREE/bin" -type f -name 'kmod-nf-conntrack-netlink*.apk' -exec cp '{}' mwan3ct-kmod/ \;
          find "$E2631_TREE/build_dir" -type f -name 'nf_conntrack_netlink.ko' -exec cp '{}' mwan3ct-kmod/ \;
          find "$E2631_TREE/build_dir" -type f -path '*/linux-sanechips_generic/linux-6.18.55/.config' -exec cp '{}' mwan3ct-kmod/kernel.config \;
          find "$E2631_TREE/build_dir" -type f -path '*/linux-sanechips_generic/linux-6.18.55/Module.symvers' -exec cp '{}' mwan3ct-kmod/Module.symvers \;
          test "$(find mwan3ct-kmod -maxdepth 1 -name 'kmod-nf-conntrack-netlink*.apk' | wc -l)" -eq 1
          test -f mwan3ct-kmod/nf_conntrack_netlink.ko
          test -f mwan3ct-kmod/kernel.config
          test -f mwan3ct-kmod/Module.symvers
          printf 'kit=%s\nbase=%s\n' "$GITHUB_SHA" "$(git -C "$E2631_TREE" rev-parse HEAD)" > mwan3ct-kmod/SOURCE-INFO.txt
          (cd mwan3ct-kmod && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: e2631-mwan3ct-kmod-${{ github.run_id }}
          path: mwan3ct-kmod/
          if-no-files-found: error
          retention-days: 7
