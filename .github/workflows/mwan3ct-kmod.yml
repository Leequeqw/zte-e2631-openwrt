name: Build E2631 ucode socket dependency

on:
  push:
    branches:
      - codex/mwan3ct-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      E2631_TREE: ${{ github.workspace }}/../openwrt
      E2631_OUT: ${{ github.workspace }}/../out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl busybox libelf-dev xsltproc
      - name: Check and bootstrap pinned source
        run: |
          make check
          make bootstrap
      - name: Build matching ucode socket package
        run: |
          set -euo pipefail
          printf '\nCONFIG_PACKAGE_ucode-mod-socket=y\n' >> "$E2631_TREE/.config"
          make -C "$E2631_TREE" defconfig
          grep -q '^CONFIG_PACKAGE_ucode-mod-socket=y' "$E2631_TREE/.config"
          make -C "$E2631_TREE" -j"$(nproc)" tools/install V=s
          make -C "$E2631_TREE" -j"$(nproc)" toolchain/install V=s
          make -C "$E2631_TREE" -j"$(nproc)" package/utils/ucode/compile V=s
      - name: Collect dependency verification bundle
        run: |
          set -euo pipefail
          mkdir -p ucode-socket
          find "$E2631_TREE/bin" -type f -name 'ucode-mod-socket*.apk' -exec cp '{}' ucode-socket/ \;
          test "$(find ucode-socket -maxdepth 1 -name 'ucode-mod-socket*.apk' | wc -l)" -eq 1
          printf 'kit=%s\nbase=%s\n' "$GITHUB_SHA" "$(git -C "$E2631_TREE" rev-parse HEAD)" > ucode-socket/SOURCE-INFO.txt
          (cd ucode-socket && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: e2631-ucode-socket-${{ github.run_id }}
          path: ucode-socket/
          if-no-files-found: error
          retention-days: 7
